name: CI-HML

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy_enabled: ${{ steps.set-deploy.outputs.deploy }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Login no DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da imagem para Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            CONFIGURATION=hml
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/nexa-landing-page:prd
            ${{ secrets.DOCKERHUB_USER }}/nexa-landing-page:${{ github.sha }}

      - name: Determine if deploy should run
        id: set-deploy
        run: |
          if [ -n "${{ secrets.SERVER_HOST }}" ] && [ -n "${{ secrets.SERVER_USER }}" ] && [ -n "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    if: ${{ needs.build.outputs.deploy_enabled == 'true' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy no servidor via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            SERVICE_NAME="${{ secrets.DOCKER_SERVICE_NAME }}"
            if [ -z "$SERVICE_NAME" ]; then
              SERVICE_NAME="landing-page"
            fi
            cd /opt/app
            docker compose pull "$SERVICE_NAME"
            docker compose up -d --no-deps --build "$SERVICE_NAME"
            docker image prune -f
